[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fintech-compliance-copilot"
version = "0.1.0"
description = "PCI DSS RAG Compliance System - Retrieval-Augmented Generation for regulatory compliance queries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pymupdf>=1.23",
    "chromadb>=0.4",
    "openai>=1.12",
    "anthropic>=0.18",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "hypothesis>=6.100",
    "pytest-asyncio>=0.23",
    "httpx>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "property: property-based tests using Hypothesis",
    "integration: integration tests requiring external services",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
